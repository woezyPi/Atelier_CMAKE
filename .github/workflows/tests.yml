
name: Automatisation des tests

on: [push, pull_request]

jobs:
  Compilation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compilation
        run: |
          cmake -S . -B build
          cmake --build build --parallel 4

  Test_Add:
    runs-on: ubuntu-latest
    needs: Compilation
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cmake -S . -B build && cmake --build build --parallel 4
      - name: Test addition
        run: ctest --test-dir build -R '^t1$' --output-on-failure

  Test_Div:
    runs-on: ubuntu-latest
    needs: Compilation
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cmake -S . -B build && cmake --build build --parallel 4
      - name: Test division
        run: ctest --test-dir build -R '^t4$' --output-on-failure

  Test_Mul:
    runs-on: ubuntu-latest
    needs: Compilation
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cmake -S . -B build && cmake --build build --parallel 4
      - name: Test multiplication
        run: ctest --test-dir build -R '^t3$' --output-on-failure

  Test_Sub:
    runs-on: ubuntu-latest
    needs: Compilation
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cmake -S . -B build && cmake --build build --parallel 4
      - name: Test soustraction
        run: ctest --test-dir build -R '^t2$' --output-on-failure
  Test_Car:
    runs-on: ubuntu-latest
    needs: Compilation
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cmake -S . -B build && cmake --build build --parallel 4
      - name: Test carré
        run: ctest --test-dir build -R '^t5$' --output-on-failure
