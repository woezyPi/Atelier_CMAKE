name: Automatisation des tests

on: push

jobs:
  Compilation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compilation
        run: |
          mkdir -p build
          cd build
          cmake ..
          make
          make test

  Test_Add:
    runs-on: ubuntu-latest
    needs: Compilation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          mkdir -p build
          cd build
          cmake ..
          make

      - name: Run test "add" and capture report
        run: |
          cd build
          echo "== Test add 10 5 ==" > report.txt
          set +e
          ./src/calculator add 10 5 | tee -a report.txt
          status=${PIPESTATUS[0]}
          echo "Exit code: $status" >> report.txt
          exit "$status"

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-add-report
          path: build/report.txt
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          echo "### Résultat du test add" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f build/report.txt ]; then
            cat build/report.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Le rapport n'a pas été généré." >> "$GITHUB_STEP_SUMMARY"
          fi